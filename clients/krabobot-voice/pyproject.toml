[project]
name = "krabobot-voice"
version = "0.2.0"
description = "Local KWS/PTT voice client for krabobot (server STT/TTS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "pynput>=1.7",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
# Legacy continuous sherpa wake (wake.mode: asr only)
asr = ["sherpa-onnx>=1.10"]
wake = ["sherpa-onnx>=1.10"]

[project.scripts]
krabobot-voice = "krabobot_voice.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["krabobot_voice*"]
