[project]
name = "krabobot-voice"
version = "0.2.0"
description = "Local wake/PTT voice client for krabobot (server STT/TTS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "pynput>=1.7",
    "sounddevice>=0.4.6",
    # WASAPI loopback for meeting.capture=loopback|mix (Windows)
    "PyAudioWPatch>=0.2.12.6; platform_system=='Windows'",
    # WinRT mic consent (AppCapability / MediaCapture) for portable exe
    "winrt-runtime>=3.0; platform_system=='Windows'",
    "winrt-Windows.Foundation>=3.0; platform_system=='Windows'",
    "winrt-Windows.Media.Capture>=3.0; platform_system=='Windows'",
    "winrt-Windows.Security.Authorization.AppCapabilityAccess>=3.0; platform_system=='Windows'",
]

[project.optional-dependencies]
# Local sherpa wake (wake.mode: asr — default) + Silero VAD (onnxruntime)
asr = ["sherpa-onnx>=1.10", "onnxruntime>=1.16"]
wake = ["sherpa-onnx>=1.10", "onnxruntime>=1.16"]
# Speech vs non-speech VAD only (no sherpa)
vad = ["onnxruntime>=1.16"]
# Portable Windows build (scripts/build_portable.ps1)
packaging = ["pyinstaller>=6.0"]

[project.scripts]
krabobot-voice = "krabobot_voice.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["krabobot_voice*"]
