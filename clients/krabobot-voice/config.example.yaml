# Copy to %LOCALAPPDATA%\krabobot-voice\config.yaml
# Token: leave empty to use api.auth.adminToken from ~/.krabobot/config.json

base_url: http://127.0.0.1:8900
device_id: local-desktop
token: ""
timeout_s: 120
sample_rate: 16000

# ---------------------------------------------------------------------------
# Wake phrase — set YOUR phrase here (loaded from this file on start)
# Primary key: wake.phrase (one string). Optional: wake.phrases (list).
# Example custom:
#   wake:
#     phrase: "Ок, Бот"
# ---------------------------------------------------------------------------
# mode: asr (default, local sherpa-onnx) | kws (optional MFCC embedding) | off
wake:
  mode: asr
  # Primary wake line (punctuation OK). Also accepts wake.phrases: [...]
  # Env override (wins over YAML): KRABOBOT_VOICE_WAKE_PHRASE="Ок, Бот"
  #   alias: VOICE_WAKE_PHRASE
  phrase: "Эй, Арнольд"
  # Optional aliases (merged with phrase, deduped). Leave empty to use only phrase.
  phrases: []
  # VAD-segmented wake: speech_start → buffer until silence → one ASR/KWS per utterance
  # Shorter silence_end than talk so wake feels snappy; max_s caps endless buffer.
  silence_end_s: 0.55
  max_s: 9.0
  min_speech_s: 0.45
  # Energy pre-gate when vad.backend=energy; with Silero this is only a
  # quiet-mic hint for ASR preprocess (speech decision uses Silero).
  # For audio.listen_source=loopback the client auto-lowers this (~0.4×)
  energy_threshold: 0.006
  # Optional greetings used with fuzzy name match (auto-derived from phrase if omitted)
  # greetings:
  #   - эй
  #   - привет
  # KWS-only (wake.mode: kws)
  threshold: 0.90
  # Empty = %LOCALAPPDATA%\krabobot-voice\wake_refs
  refs_dir: ""
  # On Windows, synthesize a few SAPI reference WAVs if refs_dir is empty (KWS)
  auto_enroll_tts: true

# ---------------------------------------------------------------------------
# VAD — Silero ONNX (default) distinguishes speech from music / noise.
# Energy backend is a fallback for tests / machines without onnxruntime.
# Install: pip install -e ".\clients\krabobot-voice[asr]"  (pulls onnxruntime)
# Model auto-downloads once to %LOCALAPPDATA%\krabobot-voice\models\silero_vad.onnx
# ---------------------------------------------------------------------------
vad:
  backend: silero          # silero | energy
  threshold: 0.5           # speech probability ≥ this → voiced frame
  energy_pregate: 0.0008   # skip Silero when RMS below (pure silence only)
  # model_path: ""         # override ONNX path (empty = default cache)

# Push-to-talk (hold-to-talk): record while chord is held
ptt:
  enabled: true
  hotkey: ctrl+alt+space

# Dialog mode + local voice commands (Talk only; Meeting hotkey still works)
# After a successful reply, listen again without wake for follow_up_s seconds.
# Each utterance is first decoded by local sherpa; matched commands stay local
# (no POST /v1/voice/turn). Cues: 2 beeps on wake, 1 beep on return to idle.
talk:
  # Empty listen (no speech yet): wait this long before idle. After speech starts,
  # end-of-utterance uses top-level silence_end_s (~2s), not this timeout.
  listen_timeout_s: 10.0  # post-wake window (fallback: no_speech_timeout_s)
  follow_up_s: 10.0       # 0 = disable; silence → 1 beep → idle
  beeps: true             # 2 beeps on wake / wake+command; 1 beep on idle return
  follow_up_beep: false   # legacy (unused when beeps handles cues)
  meeting_start:
    - начать совещание
    - начать запись
    - запиши совещание
    - начни совещание
    - начни запись
  meeting_stop:
    - закончить совещание
    - завершить запись
    - стоп запись
    - закончи совещание
    - останови запись
    - стоп совещание
  run_test:
    - выполни тест
    - выполнить тест
    - сделай тест
    - сделать тест
    - запусти тест
    - запустить тест
    - проведи тест
    - провести тест
  exit:
    - хватит
    - выход
    - спокойной ночи
    - отмена
    - закончили
    - пока

# Optional device hints (name substring or device index as string)
audio:
  # mic (default) | loopback — источник для wake + Talk/follow-up/PTT
  # loopback = WASAPI system audio (то, что играет в колонки/наушники).
  # Удобно тестировать wake без микрофона: проигрывайте TTS с фразой wake.
  # Env override (wins over YAML): KRABOBOT_VOICE_LISTEN_SOURCE=mic|loopback
  #   alias: VOICE_LISTEN_SOURCE
  listen_source: mic
  # input_device: ""      # mic (если listen_source=mic)
  # output_device: ""     # playback device whose WASAPI loopback to use
  # Alias: wake.input: mic|loopback (то же самое)

# Meeting recording (toggle hotkey → background thread → upload WAV + instruct)
# Also start/stop via talk.meeting_start / talk.meeting_stop voice commands.
# Meeting can capture system audio (Teams) independently of audio.listen_source.
meeting:
  enabled: true
  # mic | loopback | mix — default mix = mic + WASAPI loopback (remote + local)
  capture: mix
  hotkey: ctrl+alt+m
  # Empty = loopback for default output (or audio.output_device)
  loopback_device: ""
  max_s: 7200
  instruct: >-
    Это запись встречи (Teams/звонок). Сделай краткое резюме,
    ключевые решения и список action items.

# Local sherpa wake — model dir (empty = ~/.krabobot/models/stt/…)
# stt_model_dir: ""
# stt_num_threads: 2

# After beep: discard settle_s (flush mic buffer), then require min_speech_s
# before VAD may end on silence — avoids posting near-empty clips to STT.
# Client also peak/RMS-normalizes + trims before POST /v1/voice/turn.
# silence_end_s: after speech started, finish Talk/LISTEN/DIALOG on this silence
# (~2s). Empty windows still wait talk.listen_timeout_s / follow_up_s (~10s).
# no_speech_timeout_s is legacy fallback for talk.listen_timeout_s.
utterance_max_s: 15.0
settle_s: 0.35
preroll_s: 0.4
speech_start_s: 0.25
min_speech_s: 1.2
silence_end_s: 2.0
no_speech_timeout_s: 5.0
energy_threshold: 0.008

